[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cvevident"
version = "0.1.0"
description = "Evidence-led static triage for suspicious documents and local CVE context"
requires-python = ">=3.10"
authors = [{ name = "CVEvident contributors" }]
keywords = ["cybersecurity", "CVE", "PDF", "evidence", "static-analysis", "vulnerability-research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ["pypdf>=6.21.1,<7"]

[project.scripts]
cvevident = "cvevident.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
bulk = ["ijson>=3.3.0"]
